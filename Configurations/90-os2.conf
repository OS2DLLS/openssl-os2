# OS/2 configuration for OpenSSL 3.6.5 using EMX toolchain

my %targets = (
    "OS2-EMX" => {
        inherit_from     => [ "BASE_unix" ],
        CC               => "i686-pc-os2-emx-gcc",
        CFLAGS           => "-Zomf -Zsym -Zmap -O2 -Wall -DOPENSSL_SYS_OS2 -DOPENSSL_USE_IPV6=0 -DTERMIOS",
        cflags           => add('-I/data/build-nix/openssl-3.6.5-os2/deps/pthread/@unixroot/usr/include'),
        sys_id           => "OS2",
        lflags           => add("-Zomf -Zsym -Zmap -Zcrtdll"),
        ex_libs          => add('-L/data/build-nix/openssl-3.6.5-os2/deps/pthread/@unixroot/usr/lib -lpthread'),
        bn_ops           => "BN_LLONG",
        asm_arch         => "x86",
        perlasm_scheme   => "a.out",
        shared_target    => "os2-shared",
        shared_extension => ".dll",
        enable           => [ "shared", "threads" ],
        disable          => [ "zlib-dynamic", "tests", "apps", "dso", "async", "secure-memory" ],
        thread_scheme    => "pthreads",
    },
);