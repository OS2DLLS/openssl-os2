# OS/2 configuration for OpenSSL 3.6.5 using the EMX toolchain.

my $pthread_root = $ENV{OS2EMX_PTHREAD_ROOT};
if (!defined $pthread_root || $pthread_root eq '') {
    if (defined $ENV{OS2EMX_OPENSSL_BUILD_ROOT}
            && $ENV{OS2EMX_OPENSSL_BUILD_ROOT} ne '') {
        $pthread_root = "$ENV{OS2EMX_OPENSSL_BUILD_ROOT}/deps/pthread/\@unixroot/usr";
    } else {
        $pthread_root = "/\@unixroot/usr";
    }
}

my %targets = (
    "OS2-EMX" => {
        inherit_from     => [ "BASE_unix" ],
        cc               => "gcc",
        cflags           => add("-Zomf -Zsym -Zmap -O2 -Wall -DOPENSSL_SYS_OS2 -DOPENSSL_USE_IPV6=0 -DTERMIOS -I$pthread_root/include"),
        sys_id           => "OS2",
        lflags           => add("-Zomf -Zsym -Zmap -Zcrtdll"),
        ex_libs          => add("-L$pthread_root/lib -lpthread"),
        bn_ops           => "BN_LLONG",
        asm_arch         => "x86",
        perlasm_scheme   => "a.out",
        shared_target    => "os2-shared",
        shared_extension => ".dll",
        # build.info generates these definitions when shared_defflag is
        # defined; the EMX linker consumes the resulting OS/2 .def files.
        shared_defflag   => '',
        def_extension    => '.def',
        # Qt's OS/2 loader searches for crypto*.dll and ssl*.dll.  Keep the
        # static archive names unchanged.
        os2_shared_name_map => "libcrypto=crypto3,libssl=ssl3",
        enable           => [ "shared", "threads" ],
        disable          => [ "zlib-dynamic", "tests", "apps", "dso", "async", "secure-memory" ],
        thread_scheme    => "pthreads",
    },
);